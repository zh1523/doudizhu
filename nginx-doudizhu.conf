# 斗地主 Nginx 反向代理配置
# 放到 /etc/nginx/conf.d/doudizhu.conf 后执行 nginx -t && systemctl reload nginx
#
# 需要修改: 把 doudizhu.example.com 换成你的域名或服务器 IP

upstream doudizhu_backend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name doudizhu.example.com;

    # 访问日志（可选）
    access_log /var/log/nginx/doudizhu-access.log;
    error_log  /var/log/nginx/doudizhu-error.log;

    # Socket.io WebSocket 升级（必须）
    location /socket.io/ {
        proxy_pass http://doudizhu_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # 其他请求
    location / {
        proxy_pass http://doudizhu_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传限制（如果有头像等功能）
    client_max_body_size 10m;
}
